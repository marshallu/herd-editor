<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd Editor — block inserter</title>
<style>
  :root{
    --green:#00B140;
    --green-dark:#009134;
    --green-tint:#E9F7EE;
    --green-line:#A9DDBD;
    --border:#dcdcde;
    --border-soft:#e8e8e9;
    --text:#1d2327;
    --muted:#646970;
    --surface:#fff;
    --bg:#f0f0f1;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 80px;
  }
  .page{max-width:820px;margin:0 auto}

  /* ---------- editor chrome ---------- */
  .bar{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:9px 12px;margin-bottom:14px;
  }
  .bar h1{font-size:14px;font-weight:600;margin:0}
  .slug{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .spacer{flex:1}
  .btn{
    font:inherit;font-size:12px;height:31px;padding:0 12px;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:#c3c4c7;background:#fafafa}
  .btn-primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
  .btn:focus-visible,.row:focus-visible,.gap-btn:focus-visible,.res:focus-visible{
    outline:2px solid var(--green);outline-offset:1px
  }

  /* ---------- block list ---------- */
  .list{position:relative}
  .row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:11px 12px;cursor:default;
  }
  .row .name{font-weight:600;font-size:13px;white-space:nowrap}
  .row .sum{
    color:var(--muted);font-size:12px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0
  }
  .row .chev{color:#8c8f94;font-size:11px}
  .row.new{border-color:var(--green-line);background:var(--green-tint)}

  /* the insertion point — the whole point of the redesign */
  .gap{
    position:relative;height:14px;display:flex;align-items:center;justify-content:center;
  }
  .gap::before{
    content:"";position:absolute;left:0;right:0;height:1px;background:var(--green);
    opacity:0;transition:opacity .12s ease;
  }
  .gap-btn{
    position:relative;z-index:2;
    width:20px;height:20px;padding:0;line-height:0;
    border:1px solid var(--green);border-radius:50%;
    background:var(--green);color:#fff;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .12s ease;cursor:pointer;
  }
  .gap:hover::before,.gap:focus-within::before{opacity:1}
  .gap:hover .gap-btn,.gap:focus-within .gap-btn,.gap.open .gap-btn{opacity:1}
  .gap.open::before{opacity:1}
  .gap-btn:focus{opacity:1}

  .tail{padding-top:6px}
  .tail .btn{width:100%;height:34px;border-style:dashed;color:var(--muted)}
  .tail .btn:hover{color:var(--text);border-color:var(--green-line);background:var(--green-tint)}

  /* ---------- inserter popover ---------- */
  .pop{
    position:absolute;z-index:20;width:344px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 6px 20px rgba(0,0,0,.13);
    display:none;flex-direction:column;overflow:hidden;
  }
  .pop.on{display:flex}
  .pop-search{padding:8px;border-bottom:1px solid var(--border-soft)}
  .pop-search input{
    width:100%;height:31px;padding:0 9px;font:inherit;font-size:13px;
    border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);
  }
  .pop-search input::placeholder{color:#8c8f94}
  .pop-search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

  .pop-body{max-height:296px;overflow-y:auto;padding:4px 0}
  .grp{
    font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted);
    padding:8px 12px 4px;
  }
  .res{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:0 12px;height:30px;border:0;background:none;
    font:inherit;font-size:13px;color:var(--text);text-align:left;cursor:pointer;
  }
  .res:hover{background:#f6f7f7}
  .res.sel{background:var(--green-tint);box-shadow:inset 2px 0 0 var(--green)}
  .res .mark{background:var(--green-line);border-radius:2px}
  .res .tag{
    margin-left:auto;font-size:11px;color:var(--muted);
    opacity:0;
  }
  .res.sel .tag{opacity:1}
  .empty{padding:18px 12px;color:var(--muted);font-size:12px}
  .empty b{color:var(--text);font-weight:600}

  .pop-foot{
    border-top:1px solid var(--border-soft);padding:8px 12px;
    display:flex;align-items:center;gap:8px;min-height:44px;background:#fbfbfc;
  }
  .pop-foot .desc{font-size:12px;color:var(--muted);flex:1;min-width:0}
  .pop-foot kbd{
    font:inherit;font-size:10px;color:var(--muted);
    border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;
    padding:1px 4px;background:#fff;
  }

  .note{margin:22px auto 0;max-width:820px;font-size:12px;color:var(--muted)}
  .note b{color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="page">
  <div class="bar">
    <h1>Meet Marshall</h1>
    <span class="slug">/meet-marshall</span>
    <span class="spacer"></span>
    <span style="font-size:11px;color:var(--muted)">Saved 2 min ago</span>
    <button class="btn">Preview</button>
    <button class="btn btn-primary">Update</button>
  </div>

  <div class="list" id="list">
    <!-- rows + gaps injected -->
    <div class="pop" id="pop" role="dialog" aria-label="Insert a block">
      <div class="pop-search">
        <input id="q" type="search" placeholder="Search blocks" autocomplete="off" aria-label="Search blocks">
      </div>
      <div class="pop-body" id="results" role="listbox" aria-label="Blocks"></div>
      <div class="pop-foot">
        <span class="desc" id="desc"></span>
        <kbd>↑↓</kbd><kbd>↵</kbd><kbd>esc</kbd>
      </div>
    </div>
  </div>

  <div class="tail">
    <button class="btn" id="tailBtn">+ Add block at the end</button>
  </div>

  <p class="note">
    <b>Hover between any two blocks</b> to reveal the insertion point, or press <kbd>/</kbd>.
    The inserter opens where the block will land — never pinned to the bottom of the page.
  </p>
</div>

<script>
const BLOCKS = [
  {n:"Accordion",       g:"Layout",   d:"Collapsible sections of rich text."},
  {n:"Columns",         g:"Layout",   d:"Two to four side-by-side content areas."},
  {n:"Divider",         g:"Layout",   d:"A horizontal rule with optional spacing."},
  {n:"Tabs",            g:"Layout",   d:"Tabbed panels for dense reference content."},

  {n:"Basic content",   g:"Content",  d:"A heading and body copy. The default text block."},
  {n:"Billboard",       g:"Content",  d:"Full-width image with headline and button."},
  {n:"Billboard fact row", g:"Content", d:"Three to five stats below a billboard."},
  {n:"Banner",          g:"Content",  d:"Narrow page-width strip with a short message."},
  {n:"Blockquote",      g:"Content",  d:"Pull quote with attribution."},
  {n:"Accreditation",   g:"Content",  d:"Accrediting body logo, statement and contact."},

  {n:"Gallery",         g:"Media",    d:"Grid or lightbox set of images."},
  {n:"Image slider",    g:"Media",    d:"Rotating images with captions."},
  {n:"Video",           g:"Media",    d:"Embedded YouTube, Vimeo or Kaltura."},

  {n:"Blog posts",      g:"Lists",    d:"Latest posts from a category or tag."},
  {n:"Cards collection",g:"Lists",    d:"Repeatable cards with image, title and link."},
  {n:"Events",          g:"Lists",    d:"Upcoming events from the campus calendar."},
  {n:"Faculty directory",g:"Lists",   d:"Filterable staff listing from the directory."},

  {n:"Alerts",          g:"Calls to action", d:"Dismissible notice with a severity level."},
  {n:"Blog CTA",        g:"Calls to action", d:"Inline prompt to subscribe or read more."},
  {n:"Contact form",    g:"Calls to action", d:"Gravity Forms embed with styled fields."},
  {n:"Apply now",       g:"Calls to action", d:"Program-aware button to the application."},
];
const RECENT = ["Basic content","Cards collection","Accordion"];
const GROUPS = ["Recent","Layout","Content","Media","Lists","Calls to action"];

const PAGE = [
  ["Billboard","Meet Marshall — Your future starts here"],
  ["Basic content","Marshall University has served the region since 1837…"],
  ["Cards collection","4 cards — Academics, Athletics, Research, Student life"],
  ["Accordion","6 sections — Admissions, Housing, Tuition…"],
  ["Blog posts","Category: Campus news · 3 posts"],
];

const list=document.getElementById("list"), pop=document.getElementById("pop"),
      q=document.getElementById("q"), results=document.getElementById("results"),
      desc=document.getElementById("desc"), tailBtn=document.getElementById("tailBtn");
let openGap=null, sel=0, flat=[];

function render(){
  [...list.querySelectorAll(".row,.gap")].forEach(e=>e.remove());
  PAGE.forEach((b,i)=>{
    list.insertBefore(gap(i), pop);
    const r=document.createElement("div");
    r.className="row"+(b[2]?" new":"");
    r.tabIndex=0;
    r.innerHTML=`<span class="chev">▸</span><span class="name">${b[0]}</span><span class="sum">${b[1]}</span>`;
    list.insertBefore(r, pop);
  });
  list.insertBefore(gap(PAGE.length), pop);
}
function gap(i){
  const g=document.createElement("div");
  g.className="gap"; g.dataset.i=i;
  g.innerHTML=`<button class="gap-btn" aria-label="Insert a block here">+</button>`;
  g.querySelector("button").addEventListener("click",e=>{e.stopPropagation();open(g);});
  return g;
}

function openLast(){const g=[...list.querySelectorAll(".gap")].pop(); open(g);}
function open(g){
  close();
  openGap=g; g.classList.add("open");
  pop.classList.add("on");
  const top=g.offsetTop, below=list.offsetHeight-top;
  pop.style.top = (below < 300 && top > 300) ? (top-364)+"px" : (top+12)+"px";
  pop.style.left="0px";
  q.value=""; draw(); q.focus();
}
function close(){
  pop.classList.remove("on");
  if(openGap) openGap.classList.remove("open");
  openGap=null;
}

function draw(){
  const term=q.value.trim().toLowerCase();
  flat=[]; results.innerHTML="";
  const hits=BLOCKS.filter(b=>b.n.toLowerCase().includes(term));
  if(!hits.length){
    results.innerHTML=`<div class="empty">No block matches <b>${q.value}</b>.<br>Try a shorter word, or check the block library.</div>`;
    desc.textContent=""; return;
  }
  GROUPS.forEach(gname=>{
    let items = gname==="Recent"
      ? (term ? [] : RECENT.map(n=>BLOCKS.find(b=>b.n===n)))
      : hits.filter(b=>b.g===gname);
    if(!items.length) return;
    const h=document.createElement("div"); h.className="grp"; h.textContent=gname;
    results.appendChild(h);
    items.forEach(b=>{
      const el=document.createElement("button");
      el.className="res"; el.type="button"; el.setAttribute("role","option");
      el.innerHTML=`<span>${hl(b.n,term)}</span><span class="tag">Insert</span>`;
      el.addEventListener("mouseenter",()=>{sel=flat.indexOf(el);paint();});
      el.addEventListener("click",()=>insert(b));
      el._b=b; results.appendChild(el); flat.push(el);
    });
  });
  sel=0; paint();
}
function hl(name,term){
  if(!term) return name;
  const i=name.toLowerCase().indexOf(term);
  return i<0?name:name.slice(0,i)+`<span class="mark">${name.slice(i,i+term.length)}</span>`+name.slice(i+term.length);
}
function paint(){
  flat.forEach((el,i)=>el.classList.toggle("sel",i===sel));
  if(flat[sel]){ desc.textContent=flat[sel]._b.d; flat[sel].scrollIntoView({block:"nearest"}); }
}
function insert(b){
  const i=+openGap.dataset.i;
  PAGE.splice(i,0,[b.n,"Empty — click to add content",true]);
  close(); render();
}

q.addEventListener("input",draw);
document.addEventListener("keydown",e=>{
  if(!pop.classList.contains("on")){
    if(e.key==="/" && document.activeElement.tagName!=="INPUT"){
      e.preventDefault(); openLast();
    }
    return;
  }
  if(e.key==="Escape"){e.preventDefault();close();}
  if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sel+1,flat.length-1);paint();}
  if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(sel-1,0);paint();}
  if(e.key==="Enter"&&flat[sel]){e.preventDefault();insert(flat[sel]._b);}
});
document.addEventListener("click",e=>{ if(!pop.contains(e.target)) close(); });
tailBtn.addEventListener("click",e=>{e.stopPropagation();openLast();});

render();
</script>
</body>
</html>
