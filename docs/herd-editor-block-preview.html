<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd Editor — Block Preview</title>
<style>
:root{
  --green:#00B140; --green-dark:#04742D;
  --border:#dcdcde; --border-soft:#f0f0f1;
  --text:#1d2327; --muted:#646970;
  --bg:#f0f0f1; --white:#fff; --r:6px;
  --shadow:0 6px 24px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

.proto-bar{background:#1d2327;color:#f0f0f1;padding:10px 16px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap;font-size:12px}
.proto-bar strong{font-weight:600;color:#fff}
.proto-bar .hint{color:#a7aaad}
.seg{display:inline-flex;border:1px solid #3c434a;border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;border:0;color:#c3c4c7;padding:5px 12px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;font-weight:600}

.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;padding:0 4px}
.list-head h2{font-size:14px;font-weight:600;margin:0}
.list-head .count{color:var(--muted);font-size:12px}

.block{background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:12px;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 10px;
  transition:border-color .12s ease, box-shadow .12s ease}
.block.is-active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.grip{width:18px;flex:none;color:#c3c4c7;cursor:grab;display:flex;align-items:center;justify-content:center}
.type-icon{width:34px;height:34px;flex:none;border-radius:var(--r);background:var(--border-soft);
  color:#3c434a;display:flex;align-items:center;justify-content:center}
.meta{min-width:0;flex:1}
.meta .name{font-weight:700;font-size:13px;letter-spacing:-.1px}
.meta .summary{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:2px;flex:none}
.actions .divider{width:1px;height:20px;background:var(--border);margin:0 6px}
.iconbtn{width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:var(--r);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--border-soft);color:var(--text)}
.iconbtn:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.iconbtn.is-on{background:rgba(0,177,64,.1);color:var(--green-dark)}
.iconbtn.danger:hover{background:#fcf0f1;color:#b32d2e}

.panel-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:10px;background:var(--white);flex:none}
.panel-head .title{flex:1;min-width:0}
.panel-head .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.panel-head h3{margin:1px 0 0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.closebtn{width:32px;height:32px;flex:none;border:1px solid var(--border);background:var(--white);
  border-radius:var(--r);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.closebtn:hover{background:var(--border-soft);color:var(--text)}
.closebtn:focus-visible{outline:2px solid var(--green);outline-offset:1px}

.panel-tools{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fbfbfc;
  border-bottom:1px solid var(--border);flex:none}
.panel-tools .spacer{flex:1}
.vp{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:none;background:var(--white)}
.vp button{background:var(--white);border:0;border-right:1px solid var(--border);padding:5px 9px;
  color:var(--muted);cursor:pointer;line-height:0}
.vp button:last-child{border-right:0}
.vp button[aria-pressed="true"]{background:var(--green);color:#fff}
.vp button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.zoom{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--white)}
.zoom button{background:var(--white);border:0;border-right:1px solid var(--border);padding:5px 10px;
  font-size:12px;color:var(--muted);cursor:pointer}
.zoom button:last-child{border-right:0}
.zoom button[aria-pressed="true"]{background:var(--green);color:#fff;font-weight:600}

.panel-body{flex:1;min-height:0;display:flex;background:var(--bg)}

.rail{width:172px;flex:none;background:var(--white);border-right:1px solid var(--border);
  overflow:auto;padding:10px 0}
.rail-head{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:2px 14px 8px}
.rail button{display:flex;gap:8px;width:100%;text-align:left;background:transparent;border:0;
  padding:7px 14px;cursor:pointer;color:var(--muted);border-left:3px solid transparent;line-height:1.35}
.rail button:hover{background:var(--border-soft);color:var(--text)}
.rail button.is-current{border-left-color:var(--green);color:var(--text);font-weight:600;background:rgba(0,177,64,.06)}
.rail button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.rail .num{color:#a7aaad;font-variant-numeric:tabular-nums;flex:none}
.rail button.is-current .num{color:var(--green-dark)}
.rail .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{flex:1;min-width:0;overflow:auto}
.stage{padding:16px}
.stage-frame{background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin:0 auto;position:relative}
.scaler{transform-origin:top left}
.stage-note{text-align:center;color:var(--muted);font-size:11px;margin:8px 0 0}

.hiw{background:var(--white);border-top:1px solid var(--border)}
.hiw-toggle{width:100%;text-align:left;background:transparent;border:0;padding:12px 16px;
  display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.hiw-toggle:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.hiw-toggle .chev{margin-left:auto;color:var(--muted);transition:transform .15s ease}
.hiw-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hiw-panel{padding:0 16px 16px}
.hiw-panel p{margin:0 0 14px;color:var(--muted);max-width:62ch}
.kv{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kv-row{display:flex;border-bottom:1px solid var(--border-soft);font-size:12px}
.kv-row:last-child{border-bottom:0}
.kv-row dt{width:40%;flex:none;padding:8px 12px;color:var(--muted);background:#fbfbfc;margin:0}
.kv-row dd{padding:8px 12px;margin:0;min-width:0}
.kv-row dd .empty{color:#a7aaad;font-style:italic}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
  background:rgba(0,177,64,.1);color:var(--green-dark);font-weight:600}

.panel-foot{border-top:1px solid var(--border);background:var(--white);padding:10px 14px;
  display:flex;align-items:center;gap:8px;flex:none}
.btn{background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:6px 12px;cursor:pointer;color:var(--text)}
.btn:hover{background:var(--border-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.btn-primary{background:var(--green);border-color:var(--green-dark);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--green-dark)}
.btn-link{border-color:transparent;background:transparent;color:var(--green-dark);text-decoration:underline}
.btn-link:hover{background:transparent;color:var(--green)}
.spacer{flex:1}
.stepper{display:flex;gap:4px}

.scrim{position:fixed;inset:0;background:rgba(29,35,39,.28);opacity:0;pointer-events:none;
  transition:opacity .18s ease;z-index:40}
.scrim.is-open{opacity:1;pointer-events:auto}
.scrim.is-drawer{background:rgba(29,35,39,.12)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:620px;max-width:96vw;background:var(--white);
  border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;
  z-index:50;transform:translateX(100%);transition:transform .2s cubic-bezier(.2,.7,.3,1), width .2s ease}
.drawer.is-open{transform:none}
.drawer.is-wide{width:1180px}

.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.985);
  width:940px;max-width:94vw;height:min(84vh,820px);background:var(--white);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .16s ease, transform .16s ease, width .2s ease}
.modal.is-open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal.is-wide{width:1280px;height:92vh}
.modal .panel-head{border-radius:8px 8px 0 0}

@media (prefers-reduced-motion:reduce){.drawer,.modal,.scrim{transition:none}}

.fe{font-family:Georgia,"Times New Roman",serif;color:#1d2327}
.fe *{box-sizing:border-box}
.fe-hero{position:relative;height:420px;background:linear-gradient(135deg,#04742D,#00B140);
  display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.fe-hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22)}
.fe-hero .inner{position:relative;z-index:1;max-width:720px;padding:0 32px}
.fe-hero h1{font-size:52px;line-height:1.05;margin:0 0 14px;letter-spacing:-1px}
.fe-hero p{font-size:19px;line-height:1.6;margin:0;opacity:.94}
.fe-section{padding:64px 32px;max-width:1080px;margin:0 auto}
.fe-section h2{font-size:34px;margin:0 0 18px;letter-spacing:-.5px}
.fe-section p{font-size:17px;line-height:1.75;margin:0 0 16px;color:#3c434a}
.fe-video{margin-top:28px;aspect-ratio:16/9;background:#1d2327;border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:#fff}
.fe-play{width:64px;height:64px;border-radius:999px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center}
.fe-highlights{background:#04742D;color:#fff;padding:64px 32px}
.fe-highlights h2{font-size:34px;margin:0 0 34px;text-align:center}
.fe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:1080px;margin:0 auto}
.fe-card{text-align:center;padding:0 12px}
.fe-icon{width:56px;height:56px;border-radius:999px;background:rgba(255,255,255,.16);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.fe-card h3{font-size:19px;margin:0 0 8px}
.fe-card p{font-size:15px;line-height:1.6;margin:0;opacity:.9}
.fe-form{background:#f6f7f7;padding:64px 32px}
.fe-form-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.fe-form h2{font-size:30px;margin:0 0 14px}
.fe-form p{font-size:16px;line-height:1.7;color:#3c434a;margin:0}
.fe-field{margin-bottom:14px}
.fe-field label{display:block;font-size:13px;font-family:Arial,sans-serif;margin-bottom:5px;color:#3c434a}
.fe-field .box{height:42px;background:#fff;border:1px solid #c3c4c7;border-radius:3px}
.fe-submit{background:#00B140;color:#fff;padding:13px 26px;border-radius:3px;display:inline-block;
  font-family:Arial,sans-serif;font-weight:700;font-size:14px}

.fe-alt-row{padding:72px 32px}
.fe-alt-row:nth-child(even){background:#f6f7f7}
.fe-alt-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;
  gap:56px;align-items:center}
.fe-alt-row.flip .fe-alt-inner{direction:rtl}
.fe-alt-row.flip .fe-alt-inner > *{direction:ltr}
.fe-alt-img{aspect-ratio:4/3;background:linear-gradient(135deg,#c3c4c7,#8c8f94);border-radius:4px}
.fe-alt-row h3{font-size:29px;margin:0 0 14px;letter-spacing:-.4px}
.fe-alt-row p{font-size:16px;line-height:1.75;color:#3c434a;margin:0 0 14px}
.fe-alt-link{color:#04742D;font-family:Arial,sans-serif;font-size:14px;font-weight:700}

.fe-narrow .fe-grid,.fe-narrow .fe-form-inner,.fe-narrow .fe-alt-inner{grid-template-columns:1fr}
.fe-narrow .fe-alt-row.flip .fe-alt-inner{direction:ltr}
.fe-narrow .fe-hero h1{font-size:34px}
.fe-narrow .fe-section h2,.fe-narrow .fe-highlights h2,.fe-narrow .fe-form h2{font-size:26px}
.fe-narrow .fe-alt-row h3{font-size:23px}
.fe-narrow .fe-alt-row{padding:44px 24px}
</style>
</head>
<body>

<div class="proto-bar">
  <strong>Prototype:</strong>
  <span class="hint">Click the eye on any row — try the Alternator.</span>
  <div class="seg" role="group" aria-label="Presentation">
    <button id="mode-drawer" aria-pressed="true">Side drawer</button>
    <button id="mode-modal" aria-pressed="false">Centered modal</button>
  </div>
  <span class="hint">Esc closes &middot; &uarr;&darr; steps between blocks</span>
</div>

<div class="wrap">
  <div class="list-head">
    <h2>Page content</h2>
    <span class="count">6 blocks</span>
  </div>
  <div id="blocks"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="drawer-title" hidden></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden></div>

<script>
const I = {
  grip:'<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="3" r="1.4"/><circle cx="8" cy="3" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="13" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>',
  eye:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 10S4.6 4.5 10 4.5 18.5 10 18.5 10 15.4 15.5 10 15.5 1.5 10 1.5 10Z"/><circle cx="10" cy="10" r="2.6"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7.5 10 12.5 15 7.5"/></svg>',
  copy:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5"/><path d="M13 4H4.5A1.5 1.5 0 0 0 3 5.5V14"/></svg>',
  trash:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 5.5h13M8 5.5V4h4v1.5M5.5 5.5 6.3 16h7.4l.8-10.5"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5.5 5.5 14.5 14.5M14.5 5.5 5.5 14.5"/></svg>',
  wide:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4.5 3.5 10 8 15.5M12 4.5 16.5 10 12 15.5"/></svg>',
  narrow:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 4.5 8 10l-4.5 5.5M16.5 4.5 12 10l4.5 5.5"/></svg>',
  desktop:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4" width="15" height="9.5" rx="1"/><path d="M7 16.5h6"/></svg>',
  tablet:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="10" height="14" rx="1.4"/><path d="M9 14.6h2"/></svg>',
  mobile:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="2.5" width="7" height="15" rx="1.4"/><path d="M9.2 15.2h1.6"/></svg>',
  arrowL:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4.5 6.5 10 12 15.5"/></svg>',
  arrowR:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4.5 13.5 10 8 15.5"/></svg>',
  ext:'<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 3.5h5.5V9M16.5 3.5 9 11"/><path d="M14 12v4.5H3.5V6H8"/></svg>',
  play:'<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4.5 15.5 10 7 15.5z"/></svg>',
  tHero:'<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6.5h16v7H2z" opacity=".25"/><circle cx="6.5" cy="10" r="2"/><circle cx="13.5" cy="10" r="2"/></svg>',
  tDoc:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="2.5" width="12" height="15" rx="1.5"/><path d="M7 6.5h6M7 9.5h6M7 12.5h4"/></svg>',
  tBrush:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 3.5 8.5 11M8.5 11l-2.4.8-.8 2.4 2.4-.8L11 11"/><path d="M6 14.5c-1.2 1.2-3 1.2-3 1.2s0-1.8 1.2-3"/></svg>',
  tAlt:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3" width="6" height="5.5" rx="1"/><path d="M10.5 4.5h7M10.5 7h5"/><rect x="11.5" y="11.5" width="6" height="5.5" rx="1"/><path d="M2.5 13h7M2.5 15.5h5"/></svg>',
  tForm:'<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>',
  star:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.5 5.6 6.1.6-4.6 4.1 1.3 6-5.3-3.1L6.7 19.3l1.3-6L3.4 9.2l6.1-.6z"/></svg>'
};

const ALT_SECTIONS = [
  ['Admission requirements','A bachelor\u2019s degree from an accredited institution, three letters of recommendation, and a personal statement describing your interest in the counseling profession.'],
  ['Clinical mental health track','Prepares graduates for licensure as professional counselors in agency, hospital, and private practice settings across West Virginia and neighboring states.'],
  ['School counseling track','Leads to certification as a school counselor in K\u201312 settings, with placements arranged through partner districts in the Tri-State area.'],
  ['Addiction counseling track','Focuses on substance use treatment, harm reduction, and recovery support, with coursework meeting state credentialing requirements.'],
  ['Practicum and internship','Six hundred supervised clinical hours completed across two semesters, with weekly individual and group supervision from licensed faculty.'],
  ['Assistantships and funding','A limited number of graduate assistantships are available each year, covering tuition and providing a stipend in exchange for departmental work.']
];

const altRender = ALT_SECTIONS.map((s,i)=>`
  <div class="fe-alt-row${i%2?' flip':''}" data-sec="${i}">
    <div class="fe-alt-inner">
      <div class="fe-alt-img"></div>
      <div><h3>${s[0]}</h3><p>${s[1]}</p><span class="fe-alt-link">Read more &rarr;</span></div>
    </div>
  </div>`).join('');

const BLOCKS = [
  {id:'hero',name:'Hero',icon:I.tHero,
   summary:'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do\u2026 \u00b7 Static \u00b7 Object center',
   about:'A full-width banner at the top of the page. It sets the headline and one supporting line over a background image.',
   settings:[['Headline','Master of Arts in Counseling'],['Subheadline','Lorem ipsum dolor sit amet, consectetur adipiscing elit.'],['Background','Static image'],['Focal point','Object center'],['Call to action',null]],
   render:`<div class="fe-hero"><div class="inner"><h1>Master of Arts in Counseling</h1><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p></div></div>`},

  {id:'overview',name:'Basic Content',icon:I.tDoc,
   summary:'Program Overview \u00b7 The Master of Arts in Counseling (M.A.) program at Marshall Uni\u2026 \u00b7 Video',
   about:'A heading with body copy. The Video layout adds an embedded player below the text; Basic omits it.',
   settings:[['Heading','Program Overview'],['Layout','Video'],['Video source','YouTube \u00b7 mu-counseling-intro'],['Background','White'],['Anchor','program-overview']],
   render:`<div class="fe-section"><h2>Program Overview</h2><p>The Master of Arts in Counseling (M.A.) program at Marshall University prepares students for licensure as professional counselors across clinical mental health, school, and addiction settings.</p><p>Coursework combines supervised clinical practice with a research foundation, and all tracks are CACREP-accredited.</p><div class="fe-video"><div class="fe-play">${I.play}</div></div></div>`},

  {id:'highlights',name:'Highlights',icon:I.tBrush,
   summary:'Program Highlights \u00b7 Icon \u00b7 Green',
   about:'A row of short cards calling out three to six selling points. Each card carries an icon, a title, and a line of copy.',
   settings:[['Heading','Program Highlights'],['Card style','Icon'],['Color','Green'],['Cards per row','3'],['Cards','3 items']],
   render:`<div class="fe-highlights"><h2>Program Highlights</h2><div class="fe-grid">
     <div class="fe-card"><div class="fe-icon">${I.star}</div><h3>CACREP Accredited</h3><p>Meets licensure requirements in West Virginia and most other states.</p></div>
     <div class="fe-card"><div class="fe-icon">${I.star}</div><h3>600 Clinical Hours</h3><p>Supervised practicum and internship placements across the region.</p></div>
     <div class="fe-card"><div class="fe-icon">${I.star}</div><h3>Evening Courses</h3><p>Built for students who are working while they earn the degree.</p></div>
   </div></div>`},

  {id:'alternator',name:'Alternator',icon:I.tAlt,
   summary:'6 sections \u00b7 Image left first \u00b7 Alternating background',
   about:'A stack of image-and-text sections that alternate image side down the page. Each section is a row in the block\u2019s repeater; sections inherit the background alternation from their position, so reordering one changes the rhythm of the rest.',
   settings:[['Sections','6'],['First image side','Left'],['Background','Alternating'],['Image ratio','4:3'],['Link style','Text link']],
   sections:ALT_SECTIONS.map(s=>s[0]),
   render:altRender},

  {id:'careers',name:'Basic Content',icon:I.tDoc,
   summary:'Career Opportunities \u00b7 Substance abuse counselors & behavioral disorder counselors pro\u2026 \u00b7 Basic',
   about:'A heading with body copy. The Video layout adds an embedded player below the text; Basic omits it.',
   settings:[['Heading','Career Opportunities'],['Layout','Basic'],['Video source',null],['Background','White'],['Anchor','careers']],
   render:`<div class="fe-section"><h2>Career Opportunities</h2><p>Substance abuse counselors and behavioral disorder counselors provide treatment and support to people recovering from addiction or managing behavioral health conditions.</p><p>Graduates work in community agencies, hospitals, private practice, and K&ndash;12 schools.</p></div>`},

  {id:'form',name:'Salesforce Form',icon:I.tForm,
   summary:'Request \u00b7 Receive messages from our counseling department staff. Find out\u2026 \u00b7 Content',
   about:'Embeds a Salesforce inquiry form. The Content layout places explanatory copy beside the form; Full places the form across the section on its own.',
   settings:[['Form','Request information'],['Layout','Content'],['Heading','Request information'],['Campaign ID','7013a000002XyzAAB'],['Confirmation','Thank-you page']],
   render:`<div class="fe-form"><div class="fe-form-inner">
     <div><h2>Request information</h2><p>Receive messages from our counseling department staff. Find out about application deadlines, assistantships, and what a typical semester looks like.</p></div>
     <div>
       <div class="fe-field"><label>First name</label><div class="box"></div></div>
       <div class="fe-field"><label>Last name</label><div class="box"></div></div>
       <div class="fe-field"><label>Email address</label><div class="box"></div></div>
       <div class="fe-field"><label>Intended start term</label><div class="box"></div></div>
       <span class="fe-submit">Request information</span>
     </div>
   </div></div>`}
];

const VIEWPORTS={desktop:{w:1280,label:'Desktop \u00b7 1280px'},tablet:{w:834,label:'Tablet \u00b7 834px'},mobile:{w:390,label:'Mobile \u00b7 390px'}};
let state={open:false,index:0,viewport:'desktop',shell:'drawer',hiw:false,zoom:'fit',wide:false,section:0};

const listEl=document.getElementById('blocks');
function renderList(){
  listEl.innerHTML=BLOCKS.map((b,i)=>`
    <div class="block${state.open&&state.index===i?' is-active':''}" data-i="${i}">
      <div class="grip" aria-hidden="true">${I.grip}</div>
      <div class="type-icon" aria-hidden="true">${b.icon}</div>
      <div class="meta"><div class="name">${b.name}</div><div class="summary">${b.summary}</div></div>
      <div class="actions">
        <button class="iconbtn js-preview${state.open&&state.index===i?' is-on':''}" data-i="${i}" aria-label="Preview ${b.name}" title="Preview block">${I.eye}</button>
        <button class="iconbtn" aria-label="Edit ${b.name} fields" title="Edit fields">${I.chev}</button>
        <span class="divider" aria-hidden="true"></span>
        <button class="iconbtn" aria-label="Duplicate ${b.name}" title="Duplicate">${I.copy}</button>
        <button class="iconbtn danger" aria-label="Delete ${b.name}" title="Delete">${I.trash}</button>
      </div>
    </div>`).join('');
}
listEl.addEventListener('click',e=>{const b=e.target.closest('.js-preview');if(b)openPreview(+b.dataset.i);});

function panelMarkup(p){
  const b=BLOCKS[state.index];
  const rows=b.settings.map(([k,v])=>`<div class="kv-row"><dt>${k}</dt><dd>${v===null?'<span class="empty">Not set</span>':v}</dd></div>`).join('');
  const rail=b.sections?`<nav class="rail" id="${p}-rail" aria-label="Sections in this block">
      <div class="rail-head">${b.sections.length} sections</div>
      ${b.sections.map((s,i)=>`<button data-sec="${i}" class="${state.section===i?'is-current':''}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="lbl">${s}</span></button>`).join('')}
    </nav>`:'';
  return `
    <div class="panel-head">
      <div class="title">
        <div class="kicker">Block ${state.index+1} of ${BLOCKS.length} &middot; Preview</div>
        <h3 id="${p}-title">${b.name}</h3>
      </div>
      <button class="closebtn js-wide" aria-pressed="${state.wide}" aria-label="${state.wide?'Narrow the preview':'Widen the preview'}" title="${state.wide?'Narrow':'Widen'}">${state.wide?I.narrow:I.wide}</button>
      <button class="closebtn js-close" aria-label="Close preview">${I.x}</button>
    </div>
    <div class="panel-tools">
      <div class="vp" role="group" aria-label="Preview width">
        <button data-vp="desktop" aria-pressed="${state.viewport==='desktop'}" aria-label="Desktop width">${I.desktop}</button>
        <button data-vp="tablet" aria-pressed="${state.viewport==='tablet'}" aria-label="Tablet width">${I.tablet}</button>
        <button data-vp="mobile" aria-pressed="${state.viewport==='mobile'}" aria-label="Mobile width">${I.mobile}</button>
      </div>
      <div class="spacer"></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button data-zoom="fit" aria-pressed="${state.zoom==='fit'}">Fit</button>
        <button data-zoom="full" aria-pressed="${state.zoom==='full'}">100%</button>
      </div>
    </div>
    <div class="panel-body">
      ${rail}
      <div class="scroll" id="${p}-scroll">
        <div class="stage">
          <div class="stage-frame" id="${p}-frame">
            <div class="scaler ${state.viewport==='desktop'?'':'fe-narrow'} fe" id="${p}-scaler" style="width:${VIEWPORTS[state.viewport].w}px">${b.render}</div>
          </div>
          <p class="stage-note" id="${p}-note"></p>
        </div>
        <div class="hiw">
          <button class="hiw-toggle js-hiw" aria-expanded="${state.hiw}">How this block works<span class="chip">${b.name}</span><span class="chev">${I.chev}</span></button>
          ${state.hiw?`<div class="hiw-panel"><p>${b.about}</p><dl class="kv">${rows}</dl></div>`:''}
        </div>
      </div>
    </div>
    <div class="panel-foot">
      <div class="stepper">
        <button class="btn js-prev" ${state.index===0?'disabled':''} aria-label="Previous block">${I.arrowL}</button>
        <button class="btn js-next" ${state.index===BLOCKS.length-1?'disabled':''} aria-label="Next block">${I.arrowR}</button>
      </div>
      <button class="btn btn-link js-full">See it on the page ${I.ext}</button>
      <div class="spacer"></div>
      <button class="btn btn-primary js-edit">Edit fields</button>
    </div>`;
}

const scrim=document.getElementById('scrim'),drawer=document.getElementById('drawer'),modal=document.getElementById('modal');
function shellEl(){return state.shell==='drawer'?drawer:modal}

function paint(){
  const el=shellEl();
  el.hidden=false;
  el.classList.toggle('is-wide',state.wide);
  el.innerHTML=panelMarkup(state.shell);
  el.setAttribute('aria-labelledby',state.shell+'-title');
  requestAnimationFrame(()=>{fitStage();wireScroll();});
  renderList();
}

function currentScale(){
  const frame=document.getElementById(state.shell+'-frame');
  if(!frame)return 1;
  const avail=frame.parentElement.clientWidth-32;
  return state.zoom==='full'?1:Math.min(1,avail/VIEWPORTS[state.viewport].w);
}

function fitStage(){
  const frame=document.getElementById(state.shell+'-frame'),
        scaler=document.getElementById(state.shell+'-scaler'),
        note=document.getElementById(state.shell+'-note');
  if(!frame||!scaler)return;
  const s=currentScale();
  scaler.style.transform=`scale(${s})`;
  frame.style.width=Math.round(VIEWPORTS[state.viewport].w*s)+'px';
  frame.style.height=Math.round(scaler.scrollHeight*s)+'px';
  if(note)note.textContent=`${VIEWPORTS[state.viewport].label} \u00b7 ${Math.round(s*100)}% \u00b7 uses your unsaved changes`;
}

function wireScroll(){
  const b=BLOCKS[state.index];
  const scroll=document.getElementById(state.shell+'-scroll');
  const rail=document.getElementById(state.shell+'-rail');
  if(!scroll)return;
  if(rail){
    rail.addEventListener('click',e=>{
      const btn=e.target.closest('[data-sec]');if(!btn)return;
      const i=+btn.dataset.sec;state.section=i;
      const el=scroll.querySelector(`.fe [data-sec="${i}"]`);
      if(el)scroll.scrollTo({top:el.offsetTop*currentScale()+8,behavior:'smooth'});
      rail.querySelectorAll('button').forEach((x,n)=>x.classList.toggle('is-current',n===i));
    });
  }
  if(b.sections){
    scroll.addEventListener('scroll',()=>{
      const s=currentScale();
      const els=[...scroll.querySelectorAll('.fe [data-sec]')];
      let cur=0;
      els.forEach((el,i)=>{if(el.offsetTop*s<=scroll.scrollTop+120)cur=i});
      if(cur!==state.section){
        state.section=cur;
        if(rail)rail.querySelectorAll('button').forEach((x,n)=>x.classList.toggle('is-current',n===cur));
      }
    },{passive:true});
  }
}

function openPreview(i){
  state.open=true;state.index=i;state.section=0;
  paint();
  scrim.classList.add('is-open');
  scrim.classList.toggle('is-drawer',state.shell==='drawer');
  shellEl().classList.add('is-open');
  setTimeout(()=>{const c=shellEl().querySelector('.js-close');if(c)c.focus()},60);
}
function closePreview(){
  state.open=false;
  scrim.classList.remove('is-open');
  drawer.classList.remove('is-open');modal.classList.remove('is-open');
  renderList();
  const b=listEl.querySelector(`.js-preview[data-i="${state.index}"]`);if(b)b.focus();
}
function step(d){const n=state.index+d;if(n<0||n>=BLOCKS.length)return;state.index=n;state.section=0;paint()}

[drawer,modal].forEach(el=>{
  el.addEventListener('click',e=>{
    if(e.target.closest('.js-close'))return closePreview();
    if(e.target.closest('.js-prev'))return step(-1);
    if(e.target.closest('.js-next'))return step(1);
    if(e.target.closest('.js-wide')){state.wide=!state.wide;paint();return}
    if(e.target.closest('.js-hiw')){state.hiw=!state.hiw;paint();return}
    if(e.target.closest('.js-edit')){closePreview();return}
    if(e.target.closest('.js-full'))return;
    const vp=e.target.closest('[data-vp]');
    if(vp){state.viewport=vp.dataset.vp;paint();return}
    const z=e.target.closest('[data-zoom]');
    if(z){state.zoom=z.dataset.zoom;if(state.zoom==='full')state.wide=true;paint();return}
  });
});

scrim.addEventListener('click',closePreview);
window.addEventListener('resize',()=>{if(state.open)fitStage()});
document.addEventListener('keydown',e=>{
  if(!state.open)return;
  if(e.key==='Escape')closePreview();
  if(e.key==='ArrowDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowUp'){e.preventDefault();step(-1)}
});

document.getElementById('mode-drawer').addEventListener('click',()=>setShell('drawer'));
document.getElementById('mode-modal').addEventListener('click',()=>setShell('modal'));
function setShell(s){
  const was=state.open;
  if(was)closePreview();
  state.shell=s;
  document.getElementById('mode-drawer').setAttribute('aria-pressed',s==='drawer');
  document.getElementById('mode-modal').setAttribute('aria-pressed',s==='modal');
  drawer.hidden=true;modal.hidden=true;
  if(was)setTimeout(()=>openPreview(state.index),60);
}

renderList();
</script>
</body>
</html>
